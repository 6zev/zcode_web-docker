name: build-image

# 构建 zcode-web 镜像并推送到 GHCR：
#   ghcr.io/<owner>/zcode_web_docker:latest          （默认分支）
#   ghcr.io/<owner>/zcode_web_docker:sha-<短SHA>     （每次构建）
#   ghcr.io/<owner>/zcode_web_docker:<上游版本>      （自动跟随 ZCode 版本）
#
# 触发：推 main / PR（只构建不推送）/ 每天定时检查上游 ZCode 版本 /
#       手动（可强制重建、可多平台）。定时任务只在 GHCR 还没有该版本 tag 时构建。
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "VERIFY-NOTES.md"
  pull_request:
    branches: [main]
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）检查一次上游 ZCode 版本
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      push_image:
        description: 是否推送镜像到 GHCR
        type: boolean
        default: true
      force:
        description: 已有同版本镜像时也强制重建
        type: boolean
        default: false
      platforms:
        description: 目标平台（多平台要跑 QEMU，会慢很多）
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: linux/amd64

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: zcode_web_docker
  # 可在仓库 Settings → Variables 里覆盖，不用改工作流
  NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE || 'node:24.14.0-bookworm' }}
  PNPM_VERSION: ${{ vars.PNPM_VERSION || '10.33.2' }}
  UV_VERSION: ${{ vars.UV_VERSION || '0.13.7' }}
  PLAYWRIGHT_VERSION: ${{ vars.PLAYWRIGHT_VERSION || '1.59.1' }}

jobs:
  # 快速门禁：Dockerfile 与脚本的静态检查，几秒出结果
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: hadolint（Dockerfile）
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,DL3059,DL3025,DL4006

      - name: shell 语法 + compose / manifest 校验
        run: |
          set -eux
          bash -n docker-entrypoint.sh
          bash -n zcode-preflight.sh
          ZCODE_SERVER_AUTH_TOKEN=dummy python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml')); print('compose yaml ok')"
          python3 -c "import json; json.load(open('zcode-web.docker.json')); print('manifest json ok')"
          python3 -c "import yaml; d=yaml.safe_load(open('docker-compose.yml')); assert 'ZCODE_SERVER_AUTH_TOKEN' in str(d), 'compose 里找不到令牌配置'; print('compose 令牌项存在')"
          grep -q 'AS builder' Dockerfile
          grep -q 'AS runtime' Dockerfile
          grep -q 'ZCODE_AGENT_SERVER_COMMAND=/app/agent/zcode.cjs' Dockerfile
          grep -q 'ZCODE_WEB_STATIC_ROOT=/app/packages/web/dist' Dockerfile
          mkdir -p workspace

      - name: compose 校验(令牌可选 + 端口归属 + 只有 zcode-web)
        run: |
          set -eux
          # 不设令牌也能解析(用户要求:允许裸跑,只给警告)
          docker compose config > /tmp/compose.notoken.yml
          ZCODE_SERVER_AUTH_TOKEN=dummy-token-for-lint docker compose config > /tmp/compose.token.yml
          python3 - <<'PY'
          import yaml
          raw = open('docker-compose.yml', encoding='utf-8').read()
          assert 'gateway' not in raw.lower(), 'compose 里不应有网关'
          assert 'nginx' not in raw.lower() and 'caddy' not in raw.lower(), 'compose 里不应有 nginx/caddy'

          d = yaml.safe_load(open('/tmp/compose.notoken.yml'))
          svc = d['services']
          assert set(svc) == {'zcode-web'}, f'只应有 zcode-web,实际: {set(svc)}'
          zc = svc['zcode-web']
          zc_ports = zc.get('ports') or []
          assert zc_ports, '默认方案下 zcode-web 必须发布端口(靠自带令牌保护)'
          tok = (zc.get('environment') or {}).get('ZCODE_SERVER_AUTH_TOKEN')
          assert tok in (None, ''), f'不设令牌时这里应该为空,实际: {tok!r}'
          assert ':?' not in raw, '令牌不该做成必填'
          # 始终 root 运行
          assert str(zc.get('user')) == '0:0', f'compose 必须 user 0:0,实际: {zc.get("user")!r}'
          print('compose ok: 只有 zcode-web,发布', zc_ports, '/ 不设令牌可解析(令牌项为空)')

          a = yaml.safe_load(open('/tmp/compose.token.yml'))['services']
          assert (a['zcode-web'].get('environment') or {}).get('ZCODE_SERVER_AUTH_TOKEN') == 'dummy-token-for-lint'
          print('compose ok: 设了令牌能透传')
          PY

      - name: 镜像始终以 root 运行
        run: |
          set -eux
          grep -q '^USER root' Dockerfile
          grep -q '始终以 root 运行' Dockerfile
          ! grep -q 'ZCODE_DROP_PRIVILEGES' Dockerfile
          ! grep -q 'APP_UID' Dockerfile
          ! grep -q 'setpriv' docker-entrypoint.sh
          ! grep -q 'FIX_OWNERSHIP' docker-entrypoint.sh
          ! grep -q '1000:1000' docker-entrypoint.sh Dockerfile docker-compose.yml
          ! grep -qi 'gateway\|nginx\|caddy' docker-compose.yml .env.example docker-entrypoint.sh
          grep -q '不使用任何反代/网关容器' .env.example
          echo "运行身份 ok:始终 root,无非 root 回退,无网关"

      - name: 不设令牌可裸跑,但入口脚本必须打印警告
        run: |
          set -eux
          d="$(mktemp -d)"; mkdir -p "$d/data"
          chmod 755 "$d"; cp docker-entrypoint.sh "$d/ep.sh"; chmod 755 "$d/ep.sh"
          docker run --rm -v "$d/ep.sh:/ep.sh:ro" -v "$d/data:/data" \
            -e ZCODE_DATA_BASE_DIR=/data -e ZCODE_WORKSPACE=/data/ws \
            bash:5.2.37-alpine3.22 bash /ep.sh sh -c 'echo __STARTED__' > "$d/no-token.log" 2>&1
          grep -q "未设置 ZCODE_SERVER_AUTH_TOKEN" "$d/no-token.log"
          grep -q "__STARTED__" "$d/no-token.log"
          docker run --rm -v "$d/ep.sh:/ep.sh:ro" -v "$d/data:/data" \
            -e ZCODE_SERVER_AUTH_TOKEN=abc -e ZCODE_DATA_BASE_DIR=/data -e ZCODE_WORKSPACE=/data/ws \
            bash:5.2.37-alpine3.22 bash /ep.sh sh -c 'echo __STARTED__' > "$d/with-token.log" 2>&1
          grep -q "已启用令牌" "$d/with-token.log"
          echo "入口脚本行为正确:无令牌=警告且继续启动;有令牌=提示已启用"
          sed -n '1,3p' "$d/no-token.log"

  # 解析上游 ZCode 版本，并决定本次是否需要构建。
  # 定时/手动推送：GHCR 已有 <version> tag 就跳过（force=true 可强制）；push/PR 默认构建。
  upstream:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: 读取上游版本
        id: version
        run: |
          set -eux
          REF="${{ vars.ZCODE_REF || 'main' }}"
          VERSION="$(curl -fsSL --retry 3 --max-time 30 \
            "https://raw.githubusercontent.com/zai-org/ZCode/${REF}/package.json" | jq -r '.version')"
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "上游 ZCode: v${VERSION} (ref=${REF})"

      - name: 登录 GHCR（只读，用于查询已有版本 tag）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 判断是否需要构建
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          PUSH_INPUT: ${{ github.event.inputs.push_image || 'false' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          SHOULD=true
          CHECK=false
          if [ "$EVENT" = "schedule" ]; then CHECK=true; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUSH_INPUT" = "true" ]; then CHECK=true; fi
          if [ "$CHECK" = "true" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "force=true，强制构建"
            else
              IMG="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION}"
              if docker manifest inspect "${IMG}" >/dev/null 2>&1; then
                echo "已存在 ${IMG}，跳过构建（需要重建请带 force=true）"
                SHOULD=false
              else
                echo "GHCR 还没有 ${IMG}，开始构建"
              fi
            fi
          fi
          echo "should_build=${SHOULD}" >> "$GITHUB_OUTPUT"

  # 真构建：单平台时顺便 load 到本地跑冒烟测试；push 事件推送到 GHCR
  build:
    needs: [lint, upstream]
    if: needs.upstream.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: 计算构建参数
        id: cfg
        run: |
          set -eux
          PLATFORMS="${{ github.event.inputs.platforms || 'linux/amd64' }}"
          PUSH="false"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            PUSH="true"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push_image }}" = "true" ]; then
            PUSH="true"
          fi
          SMOKE="false"
          if [ "${PUSH}" = "false" ] && [ "${PLATFORMS}" = "linux/amd64" ]; then
            SMOKE="true"
          fi
          {
            echo "platforms=${PLATFORMS}"
            echo "push=${PUSH}"
            echo "smoke=${SMOKE}"
          } >> "$GITHUB_OUTPUT"

      - name: QEMU（跨平台构建用）
        if: contains(steps.cfg.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.upstream.outputs.version }}
          labels: |
            org.opencontainers.image.title=ZCode Web (official zai-org/ZCode)
            org.opencontainers.image.description=Single-image ZCode Web: @zcode/server HTTP/WS + zcode.cjs app-server over stdio
            org.opencontainers.image.source=https://github.com/zai-org/ZCode
            org.opencontainers.image.version=${{ needs.upstream.outputs.version }}

      - name: 构建（并推送）
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push == 'true' }}
          load: ${{ steps.cfg.outputs.smoke == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            ZCODE_REF=${{ vars.ZCODE_REF || 'main' }}
            UV_VERSION=${{ env.UV_VERSION }}
            PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
          provenance: false

      # ---- 冒烟测试：真把镜像跑起来，探活 + 容器内自检 ----
      - name: 启动容器
        if: steps.cfg.outputs.smoke == 'true'
        run: |
          set -eux
          IMG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"
          # 用匿名卷起容器(始终 root);bind mount 的属主问题已由 root 运行消除
          docker run -d --name zcode-smoke --shm-size=1g -p 3030:3030 "${IMG}"

      - name: 等待健康
        if: steps.cfg.outputs.smoke == 'true'
        run: |
          set -eux
          code=""
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3030/api/server-info || true)"
            echo "attempt ${i}: ${code}"
            [ "${code}" = "200" ] && break
            sleep 5
          done
          [ "${code}" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3030/)" = "200" ]

      - name: 容器内自检脚本
        if: steps.cfg.outputs.smoke == 'true'
        run: docker exec zcode-smoke /usr/local/bin/zcode-preflight.sh

      - name: 失败时导出日志
        if: failure()
        run: |
          docker ps -a || true
          docker logs zcode-smoke 2>&1 | tail -200 || true

      - name: 清理本地镜像(省 runner 磁盘)
        if: steps.cfg.outputs.smoke == 'true'
        run: |
          docker rm -f zcode-smoke 2>/dev/null || true
          docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "zcode_web_docker" | xargs -r docker rmi -f 2>/dev/null || true

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "### zcode-web 镜像构建"
            echo ""
            echo "- 上游 ZCode: \`v${{ needs.upstream.outputs.version }}\`"
            echo "- 平台: \`${{ steps.cfg.outputs.platforms }}\`"
            echo "- 推送: \`${{ steps.cfg.outputs.push }}\`"
            echo "- 冒烟测试: \`${{ steps.cfg.outputs.smoke }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
