name: zcode-web

services:
  zcode-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:24.14.0-bookworm}
        PNPM_VERSION: ${PNPM_VERSION:-10.33.2}
        ZCODE_REPO: ${ZCODE_REPO:-https://github.com/zai-org/ZCode.git}
        ZCODE_REF: ${ZCODE_REF:-main}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        UV_VERSION: ${UV_VERSION:-0.13.7}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.59.1}
    image: ${IMAGE_NAME:-zcode-web}:${IMAGE_TAG:-3.17.2}
    container_name: zcode-web
    restart: unless-stopped
    init: true
    # 对外入口:用 zcode 自带的令牌保护(ZCODE_SERVER_AUTH_TOKEN),不需要任何代理容器。
    # /api/* 与 /ws 都要求令牌;首次访问 http://<host>:3030/?token=<令牌> 换成 Cookie 即可。
    # 不设令牌也能启动(方便本机/内网试跑),但启动日志会打印醒目警告,端口就成了裸奔。
    # 注意:本镜像始终以 root 运行,不提供非 root 切换。
    ports:
      - "${BIND_HOST:-0.0.0.0}:${BIND_PORT:-3030}:3030"
    environment:
      PORT: "3030"
      HOST: "0.0.0.0"
      ZCODE_SERVER_HOST: "0.0.0.0"
      ZCODE_WEB_STATIC_ROOT: /app/packages/web/dist
      TZ: ${TZ:-Asia/Saigon}
      # 访问令牌。留空 = 不开启令牌保护(此时任何能访问本端口的人都能用,启动日志会大声警告)。
      # 生成: openssl rand -hex 24
      ZCODE_SERVER_AUTH_TOKEN: ${ZCODE_SERVER_AUTH_TOKEN:-}
      # Chrome 运行在 root 下需要 --no-sandbox;镜像里的 wrapper 已默认加上。
      ZCODE_CHROME_NO_SANDBOX: ${ZCODE_CHROME_NO_SANDBOX:-1}
      # 可选代理
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.local}
    # 运行身份:始终 root。镜像与 compose 都固定 user 0:0,入口脚本保证目录可写。
    user: "0:0"
    volumes:
      # ZCode 原生数据目录(~/.zcode):凭据 / 会话库 / 插件缓存 / 日志。
      # 必须持久化，否则重建容器要重新登录。
      - zcode-data:/root/.zcode
      # 工作区 = /root:宿主机目录直接映射为 agent 的工作根目录。
      # (/root/.zcode 是更深的挂载点,不会被子目录遮住。)
      - ${WORKSPACE_DIR:-./workspace}:/root
      # 生成的令牌文本留一份在这里,便于随时查看/轮换(数据卷的一部分)
      - ./token:/root/.zcode/token
    security_opt:
      - no-new-privileges:true
    # Chromium dùng /dev/shm; 64MB mặc định dễ crash khi mở nhiều tab.
    shm_size: "1gb"
    stop_grace_period: 30s

volumes:
  zcode-data:
