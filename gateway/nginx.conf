# ZCode 网关(nginx · 轻量版)
#
#   docker run ... nginx:1.27-alpine
#
# 作用:zcode 本体不对外发布端口;所有请求(含 WebSocket /ws)先过 Basic Auth 才被转发。
# 这份配置会被官方 nginx 镜像的 entrypoint 做环境变量替换(${VAR} 形式),
# 所以下面这些变量可以在 compose/run 里直接给:
#
#   ZCODE_UPSTREAM    上游,默认 zcode-web:3030
#   ZCODE_AUTH_REALM  Basic Auth 提示语
#
# 注意:$http_upgrade / $connection_upgrade 这类 nginx 自身的变量不能写成 ${...}。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 关闭版本号、控制日志噪音
  server_tokens off;
  log_format brief '$remote_addr "$request" $status ${request_time}s';
  access_log /var/log/nginx/access.log brief;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # WebSocket:有 Upgrade 头就 upgrade,否则 close
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 简单限速,主要挡暴力破解。注意:浏览器打开页面会并发拉几十个资源,
  # 突发值给小了会 503(踩过)。要调整就设 ZCODE_RATE / ZCODE_BURST,
  # 想彻底关掉(比如本地调试)把 ZCODE_BURST 设成很大的值或按需删掉 limit_req。
  limit_req_zone $binary_remote_addr zone=zcode:10m rate=${ZCODE_RATE};

  # 上游。用变量 + resolver(Docker 内置 DNS 127.0.0.11)而不是 upstream 块:
  # 否则 nginx 在启动时就要解析 zcode-web —— 上游没起来会直接启动失败;
  # 用变量则在请求时才解析,上游晚启动/重建容器都不影响。
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # 上游地址(请求时才解析,见上面 resolver 的说明)
    set $zcode_upstream "${ZCODE_UPSTREAM}";

    # 需要 HTTPS 时:挂载你自己的证书并打开下面两行(同时把容器端口映射到 443)
    # listen 443 ssl;
    # ssl_certificate /certs/fullchain.pem; ssl_certificate_key /certs/privkey.pem;

    client_max_body_size 512m;      # 上传代码/附件
    limit_req zone=zcode burst=${ZCODE_BURST} nodelay;

    # ---- 访问保护:整个站点都要口令(含 /ws) ----
    auth_basic "${ZCODE_AUTH_REALM}";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
      # 变量形式需要自己拼 URI(含 query)
      proxy_pass http://$zcode_upstream$request_uri;
      proxy_http_version 1.1;
      # 长连接复用($zcode_upstream 变量,与上面的 set 同名不冲突)
      proxy_set_header Connection $connection_upgrade;

      # WebSocket / SSE 透传
      proxy_set_header Upgrade $http_upgrade;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # 长连接(agent 会话可能长时间静默)+ 不缓冲流式输出
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
